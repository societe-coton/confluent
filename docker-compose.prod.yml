# Production stack — postgres + api + web. The api-migrate service is a one-shot job
# that applies Prisma migrations before the api container(s) start, ensuring
# zero race conditions on multi-replica deploys.
#
# Required env vars (from .env or CI secrets):
#   API_IMAGE                 — image tag, e.g. ghcr.io/org/confluent-api:production-latest
#   WEB_IMAGE                 — image tag, e.g. ghcr.io/org/confluent-web:production-latest
#   DATABASE_URL              — full Postgres connection string
#   POSTGRES_USER / _PASSWORD / _DB — used by the postgres service only
#   WEB_PORT                  — host port for the web container (default: 80)
#   + all the keys validated by apps/api/src/config/config.schema.ts
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      retries: 10
    restart: unless-stopped

  api-migrate:
    image: ${API_IMAGE}
    command: ['pnpm', '--filter', '@confluent/api', 'db:migrate:deploy']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api-seed-v2:
    image: ${API_IMAGE}
    command: ['pnpm', '--filter', '@confluent/api', 'questionnaire:v2']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    profiles: ['seed']
    restart: 'no'

  api:
    image: ${API_IMAGE}
    command: ['node', 'apps/api/dist/main.js']
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3000}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-80}:80'

volumes:
  postgres_data:
    driver: local
