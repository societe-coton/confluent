server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash-named build assets — long cache, immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: route everything else to index.html so react-router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
