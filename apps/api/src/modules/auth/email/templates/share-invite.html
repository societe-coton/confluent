<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="{{lang}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no" />
  <title>{{subject}}</title>
  <!--[if mso]>
  <style type="text/css">
    table, td, div, p, a { font-family: 'Segoe UI', Calibri, Arial, sans-serif !important; }
    table { border-collapse: collapse; }
  </style>
  <![endif]-->
</head>
<body style="margin:0; padding:0; background-color:#FAFAF9; color:#1A1A1A; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; line-height:0; font-size:0; color:#FAFAF9;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FAFAF9; width:100%;">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="width:560px; max-width:560px; background-color:#FFFFFF; border:1px solid #E8E8E7; border-radius:6px;">
          <tr>
            <td style="padding:32px 32px 16px; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
              <p style="margin:0 0 8px 0; font-size:13px; line-height:1.4; color:#6B6B6B; letter-spacing:0.06em; text-transform:uppercase; font-weight:500;">{{brandLabel}}</p>
              <h1 style="margin:0 0 24px 0; font-size:22px; line-height:1.3; font-weight:600; color:#1A1A1A;">{{title}}</h1>
              <p style="margin:0 0 12px 0; font-size:15px; line-height:1.55; color:#1A1A1A;">{{body}}</p>
              <p style="margin:0 0 28px 0; font-size:17px; line-height:1.4; font-weight:600; color:#1A1A1A;">{{dossierName}}</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#37352F" style="border-radius:6px;">
                    <a href="{{shareUrl}}" target="_blank" style="display:inline-block; padding:12px 24px; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:15px; line-height:1; font-weight:500; color:#FFFFFF; text-decoration:none; border-radius:6px; mso-padding-alt:0;">
                      <!--[if mso]>&nbsp;&nbsp;&nbsp;<![endif]-->{{cta}}<!--[if mso]>&nbsp;&nbsp;&nbsp;<![endif]-->
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0 0; font-size:13px; line-height:1.55; color:#6B6B6B;">{{fallbackLabel}}</p>
              <p style="margin:6px 0 0 0; font-size:13px; line-height:1.55;">
                <a href="{{shareUrl}}" style="color:#37352F; word-break:break-all; text-decoration:underline;">{{shareUrl}}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px; border-top:1px solid #E8E8E7; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
              <p style="margin:0; font-size:12px; line-height:1.55; color:#6B6B6B;">{{footer}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
