name: Production release — Web

on:
  push:
    branches: ["production"]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/production-web.yml"

env:
  REGISTRY: ghcr.io

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase image repo path
        id: repo
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: web-v
          release_branches: production

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Web ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.value }}-web

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: prod
          push: true
          build-args: |
            DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN_WEB_PRODUCTION }}
            APP_VERSION=${{ steps.tag_version.outputs.new_version }}
          secrets: |
            DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN_WEB_PRODUCTION }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.value }}-web:production-${{ steps.tag_version.outputs.new_tag }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.value }}-web:production-latest
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

